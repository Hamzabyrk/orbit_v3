name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Kod Taraması (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Depoyu Getir
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 · 2026-09-06'da çözüldü

      - name: CodeQL Başlat
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3 · 2026-09-06'da çözüldü
        with:
          languages: javascript-typescript

      - name: CodeQL Analizi
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3 · 2026-09-06'da çözüldü
