name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Kod Taraması (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Depoyu Getir
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 · 2026-09-06'da çözüldü

      - name: CodeQL Başlat
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3 · 2026-09-06'da çözüldü
        with:
          languages: javascript-typescript

      - name: CodeQL Analizi
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3 · 2026-09-06'da çözüldü
