name: CI Pipeline

on:
  # Hedef dal filtresi bilinçli olarak yok. `branches: [main]` yazıldığında,
  # base'i main olmayan bir PR (yığılı/stacked çalışma) hiçbir kontrol
  # almıyordu — kalite kapısı sessizce devre dışı kalıyordu. Her PR
  # doğrulanmalıdır, hangi dala hedeflenirse hedeflensin.
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 · 2026-09-06'da çözüldü

      - name: pnpm kurulumu
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 · 2026-09-06'da çözüldü

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 · 2026-09-06'da çözüldü
        with:
          node-version: 22
          cache: "pnpm"

      - name: Bağımlılıkları Yükle
        run: pnpm install --frozen-lockfile

      - name: Kod Formatı Kontrolü (Prettier)
        run: pnpm run format:check

      - name: Lint Kontrolü (ESLint)
        run: pnpm run lint

      - name: Tip Kontrolü (Type Check)
        run: pnpm check

      - name: Birim Testleri Çalıştır
        run: pnpm test

      - name: Lisans Kontrolü
        run: pnpm licenses list --prod --json > licenses.json && node .github/scripts/check-licenses.mjs licenses.json

      - name: Build Kontrolü
        run: pnpm build

      # Kapı yalnızca production bağımlılıklarına uygulanır. ORBIT bir Vite
      # SPA'dır; kullanıcının tarayıcısına ulaşan kod yalnızca production
      # ağacından gelir. devDependencies'teki açıklar CI makinesinde çalışan
      # derleme araçlarını ilgilendirir ve büyük çoğunluğu transitive olduğu
      # için doğrudan kapatılamaz. Tamamını engelleyici yapmak, kapının kalıcı
      # olarak kırmızı kalmasına ve zamanla göz ardı edilmesine yol açardı.
      - name: Bağımlılık Güvenlik Taraması — Production (engelleyici)
        run: pnpm audit --prod --audit-level=high

      # Geliştirme bağımlılıkları engellemez ama görünür kalır; tedarik zinciri
      # riski böylece takip edilebilir.
      - name: Bağımlılık Güvenlik Taraması — Geliştirme (bilgilendirme)
        run: pnpm audit --audit-level=high
        continue-on-error: true
