name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pnpm kurulumu
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Bağımlılıkları Yükle
        run: pnpm install --frozen-lockfile

      - name: Kod Formatı Kontrolü (Prettier)
        run: pnpm run format:check

      - name: Lint Kontrolü (ESLint)
        run: pnpm run lint

      - name: Tip Kontrolü (Type Check)
        run: pnpm check

      - name: Birim Testleri Çalıştır
        run: pnpm test

      - name: Build Kontrolü
        run: pnpm build

      - name: Bağımlılık Güvenlik Taraması (Audit)
        run: pnpm audit --audit-level=high
        continue-on-error: true
